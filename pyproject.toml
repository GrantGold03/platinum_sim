[project]
name = "platsim"
version = "0.3.0"
description = "Pokemon Platinum Champion team optimizer, checked against the pokeplatinum decomp and battle-tested with Pokemon Showdown"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "openpyxl",
]

[project.scripts]
platsim = "platsim.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No .pytest_cache in the repo. Per-process temp dir under /dev/shm: see tests/conftest.py.
addopts = "-p no:cacheprovider"
markers = [
    "browser: real-browser tests (system Chrome via Playwright)",
]
